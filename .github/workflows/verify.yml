name: Quality Gate CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tibia_idle
          POSTGRES_PASSWORD: tibia_idle_dev
          POSTGRES_DB: tibia_idle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tibia_idle -d tibia_idle_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://tibia_idle:tibia_idle_dev@127.0.0.1:5432/tibia_idle_test
      REQUIRE_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run docs, tooling, lint, typecheck, build, unit & DB integration gates
        run: pnpm run verify
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser E2E smoke tests
        run: pnpm run test:e2e
      - name: Upload Playwright visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/screenshots/
          if-no-files-found: warn
          retention-days: 7
